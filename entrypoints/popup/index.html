<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>StreamDraft</title>
    <link rel="stylesheet" href="./style.css" />
  </head>
  <body>
    <header>
      <h1>StreamDraft</h1>
      <div class="header-actions">
        <button type="button" id="refresh" hidden title="Check the page for videos again">Refresh</button>
        <a href="#" id="open-settings">Settings</a>
      </div>
    </header>
    <p id="refresh-note" role="status" hidden></p>
    <div id="capture" hidden></div>
    <ul id="media-list"></ul>
    <p id="empty-notice" hidden>No videos found on this page.</p>
    <footer>
      <span id="status">Background: checking...</span>
      <span id="mode-note" hidden>Demo data. Nothing is downloaded.</span>
    </footer>
    <script type="module" src="./main.ts"></script>
  </body>
</html>
