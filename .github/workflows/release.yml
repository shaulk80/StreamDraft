name: Release

# A "v*" tag creates a DRAFT release. A manual run (workflow_dispatch) is a
# dry run: it does everything except create the release and uploads the files
# as the "release-preview" artifact. The owner publishes the draft.
# Firefox signing on AMO (unlisted) is added in milestone M5.

on:
  push:
    tags: ['v*']
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  ci:
    name: ci
    uses: ./.github/workflows/ci.yml
    permissions:
      contents: read

  release:
    name: release
    needs: ci
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: packages
          path: assets

      - name: Verify checksums
        working-directory: assets
        run: sha256sum -c SHA256SUMS.txt

      - name: Read version and check it against the tag
        env:
          IS_TAG: ${{ startsWith(github.ref, 'refs/tags/v') }}
        run: |
          version=$(jq -r .version package.json)
          if [ "$IS_TAG" = "true" ] && [ "$GITHUB_REF_NAME" != "v$version" ]; then
            echo "Tag $GITHUB_REF_NAME does not match package.json version v$version"
            exit 1
          fi
          echo "VERSION=$version" >> "$GITHUB_ENV"

      - name: Extract release notes
        run: |
          awk -v v="$VERSION" '
            /^## / { if (found) exit; if (index($0, "## " v " ") == 1) found = 1 }
            found { print }
          ' RELEASE_NOTES.md > notes.md
          if [ ! -s notes.md ]; then
            echo "RELEASE_NOTES.md has no section starting with '## $VERSION '"
            exit 1
          fi

      - name: Upload preview (dry run)
        if: github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v4
        with:
          name: release-preview
          path: |
            assets/*
            notes.md
          retention-days: 14

      - name: Create draft release
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          prerelease=""
          case "$VERSION" in
            *-*|0.0.*) prerelease="--prerelease" ;;
          esac
          gh release create "$GITHUB_REF_NAME" assets/* \
            --draft \
            --title "StreamDraft $VERSION" \
            --notes-file notes.md \
            $prerelease
