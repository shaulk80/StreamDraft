name: Release

# A "v*" tag creates a DRAFT release. A manual run (workflow_dispatch) is a
# dry run: it does everything except create the release and uploads the files
# as the "release-preview" artifact. The owner publishes the draft.
# On a tag the Firefox build is signed on AMO (unlisted, decision 0011). A dry
# run does not sign: AMO signs a version number only once, so a dry run would
# use up the version of the real release.

on:
  push:
    tags: ['v*']
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  ci:
    name: ci
    uses: ./.github/workflows/ci.yml
    permissions:
      contents: read

  release:
    name: release
    needs: ci
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: packages
          path: assets

      - name: Verify checksums
        working-directory: assets
        run: sha256sum -c SHA256SUMS.txt

      - name: Read version and check it against the tag
        env:
          IS_TAG: ${{ startsWith(github.ref, 'refs/tags/v') }}
        run: |
          version=$(jq -r .version package.json)
          if [ "$IS_TAG" = "true" ] && [ "$GITHUB_REF_NAME" != "v$version" ]; then
            echo "Tag $GITHUB_REF_NAME does not match package.json version v$version"
            exit 1
          fi
          echo "VERSION=$version" >> "$GITHUB_ENV"

      - name: Extract release notes
        run: |
          awk -v v="$VERSION" '
            /^## / { if (found) exit; if (index($0, "## " v " ") == 1) found = 1 }
            found { print }
          ' RELEASE_NOTES.md > notes.md
          if [ ! -s notes.md ]; then
            echo "RELEASE_NOTES.md has no section starting with '## $VERSION '"
            exit 1
          fi

      - name: Firefox signing skipped (dry run)
        if: github.event_name == 'workflow_dispatch'
        run: echo "::notice title=Dry run::The Firefox build is not signed in a dry run, because AMO signs a version number only once."

      - uses: pnpm/action-setup@v4
        if: github.event_name == 'push'

      - uses: actions/setup-node@v4
        if: github.event_name == 'push'
        with:
          node-version: 26
          cache: pnpm

      # web-ext comes from the lockfile. Install scripts are not needed for it.
      - name: Install dependencies
        if: github.event_name == 'push'
        run: pnpm install --frozen-lockfile --ignore-scripts

      # Without the AMO secrets the script warns and leaves the unsigned zip in place.
      - name: Sign the Firefox build
        if: github.event_name == 'push'
        env:
          WEB_EXT_API_KEY: ${{ secrets.AMO_JWT_ISSUER }}
          WEB_EXT_API_SECRET: ${{ secrets.AMO_JWT_SECRET }}
        run: bash scripts/sign-firefox.sh assets signed

      # Kept even when a later step fails: a version already signed cannot be signed again.
      - name: Keep the signed Firefox package
        if: always() && github.event_name == 'push' && hashFiles('signed/*.xpi') != ''
        uses: actions/upload-artifact@v4
        with:
          name: signed-firefox
          path: signed/*.xpi
          retention-days: 90

      - name: Upload preview (dry run)
        if: github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v4
        with:
          name: release-preview
          path: |
            assets/*
            notes.md
          retention-days: 14

      - name: Create draft release
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          prerelease=""
          case "$VERSION" in
            *-*|0.0.*) prerelease="--prerelease" ;;
          esac
          gh release create "$GITHUB_REF_NAME" assets/* \
            --draft \
            --title "StreamDraft $VERSION" \
            --notes-file notes.md \
            $prerelease
