name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
  workflow_call:

# The "ci-" prefix keeps this group different from the caller's group when
# release.yml calls this workflow (github.workflow is then the caller's name).
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # Branch protection refers to this job name. Do not rename it without
  # updating .github/rulesets/protect-main.json.
  build-windows:
    name: build-windows
    runs-on: windows-2022
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      # pnpm version comes from "packageManager" in package.json.
      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 26
          cache: pnpm

      - name: Build, test, package, smoke-test
        shell: pwsh
        run: ./scripts/build.ps1

      - name: Upload packages
        if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v4
        with:
          name: packages
          path: dist/packages/*
          retention-days: 14
          if-no-files-found: error
